services:
  snat-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      # 默认只绑定到宿主机回环，要求前置 Nginx/Caddy 反代后再对外开放；
      # 避免 `docker compose up -d` 后面板直接明文裸露在公网 5000 端口。
      - "127.0.0.1:${SNAT_WEB_BIND:-5000}:5000"
    environment:
      # 首次启动可从 .env 注入管理员密码；初始化后应从 .env 删除，避免长期保留。
      SNAT_ADMIN_PASSWORD: ${SNAT_ADMIN_PASSWORD:-}
      SNAT_TOKEN_SECRET: ${SNAT_TOKEN_SECRET:?请在 .env 设置 SNAT_TOKEN_SECRET (见 .env.example)}
      # 可选：集中托管 Flask session 密钥（不设则容器内自动生成并持久化到卷）
      SNAT_SECRET_KEY: ${SNAT_SECRET_KEY:-}
      # 生产公网面板应由反代终止 TLS，并开启 FORCE_HTTPS/TRUST_PROXY。
      FORCE_HTTPS: "${FORCE_HTTPS:-0}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      WEB_HOST: "${WEB_HOST:-0.0.0.0}"
      WEB_PORT: "5000"
      SNAT_DB_FILE: /data/snat_manager.db
      SNAT_SECRET_KEY_FILE: /data/secret_key
      SNAT_LOG_FILE: /data/logs/snat_web.log
      BACKUP_DIR: /data/backups
      # 默认不暴露指标；设置强随机 Token 后以 Authorization: Bearer TOKEN 访问。
      SNAT_METRICS_TOKEN: ${SNAT_METRICS_TOKEN:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  snat-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    network_mode: host
    # 仅授予操作 iptables/转发所需的能力，去掉其余 root 能力，缩小爆炸半径。
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      # 从 .env 注入强随机 token，未设置则 compose 报错退出（见 .env.example）。
      AGENT_TOKEN: ${AGENT_TOKEN:?请在 .env 设置 AGENT_TOKEN (见 .env.example)}
      DNS_REFRESH_INTERVAL: "60"
      # 外网部署：把 AGENT_HOST 设成 WireGuard 内网 IP，让 Agent 只在隧道内监听。
      AGENT_HOST: "${AGENT_HOST:-127.0.0.1}"
      AGENT_PORT: "${AGENT_PORT:-8888}"
      # 默认仅签名严格模式；仅当对接无法签名的老面板时才临时改 1。
      AGENT_ALLOW_BEARER: "${AGENT_ALLOW_BEARER:-0}"
      # 公网直连务必填面板出口 IP/网段做来源白名单（逗号分隔，支持 CIDR）；留空=仅靠签名。
      AGENT_ALLOWED_IPS: "${AGENT_ALLOWED_IPS:-}"
    volumes:
      - ./data/agent:/var/lib/snat-agent
      - ./logs:/var/log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
