<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - SNAT 管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-pink: #ffb3c6;
            --primary-pink-strong: #ff85a1;
            --secondary-blue: #a8dadc;
            --secondary-blue-strong: #457b9d;
            --text: #4a4a4a;
            --muted: #7a6d74;
            --border: rgba(255, 179, 198, 0.36);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --danger: #ef476f;
            --warn-bg: rgba(255, 251, 235, 0.92);
            --warn-border: rgba(245, 158, 11, 0.32);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; 
            background:
                radial-gradient(920px 560px at 10% -10%, rgba(255, 179, 198, 0.5), transparent 58%),
                radial-gradient(860px 480px at 108% 12%, rgba(168, 218, 220, 0.42), transparent 56%),
                linear-gradient(135deg, #ffe5ec 0%, #c9e4de 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .sakura-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            top: -20px;
            background: linear-gradient(135deg, rgba(255, 192, 203, 0.95), rgba(255, 179, 198, 0.72));
            border-radius: 150% 0 150% 150%;
            opacity: 0.8;
            animation: sakura-fall linear infinite;
        }
        @keyframes sakura-fall {
            0% { transform: translateY(-18px) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(72px); }
        }
        .login-box {
            background: var(--glass-bg);
            padding: 40px 34px;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 18px 48px rgba(255, 179, 198, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
            z-index: 2;
        }
        @media (max-width: 768px) {
            .login-box { padding: 28px 20px; margin: 0 12px; }
            h1 { font-size: 22px; margin-bottom: 18px; }
            .form-group input { font-size: 16px; }
            button { font-size: 16px; }
        }
        h1 { text-align: center; margin-bottom: 26px; color: var(--primary-pink-strong); font-size: 24px; font-weight: 800; text-shadow: 1px 1px 2px rgba(255,255,255,.6); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #66545e; font-size: 14px; }
        .form-group input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border); 
            border-radius: 12px;
            font-size: 14px;
            background: rgba(255,255,255,.85);
            color: var(--text);
        }
        .form-group input:focus { outline: none; border-color: var(--primary-pink-strong); box-shadow: 0 0 0 3px rgba(255,133,161,.18); }
        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, var(--primary-pink-strong) 0%, var(--primary-pink) 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
            margin-top: 4px;
            box-shadow: 0 8px 20px rgba(255, 133, 161, 0.28);
        }
        button:hover { background: linear-gradient(135deg, #ff6f91 0%, var(--primary-pink-strong) 100%); transform: translateY(-1px); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,133,161,.35); }
        .error { color: var(--danger); margin-top: 12px; text-align: center; font-size: 14px; min-height: 20px; }
        .warning { 
            background: var(--warn-bg); 
            border: 1px solid var(--warn-border); 
            border-left: 3px solid #d97706;
            padding: 12px 14px; 
            border-radius: 12px; 
            margin-bottom: 22px;
            font-size: 13px;
            line-height: 1.6;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="sakura-container" id="sakuraContainer"></div>
    <div class="login-box">
        <h1>🔐 SNAT 管理系统</h1>
        <div class="warning">
            ⚠️ 默认账号：admin / 安装时设置或自动生成<br>
            首次登录后必须修改密码，生产环境请通过 HTTPS 访问。
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">登录</button>
            <div class="error" id="error"></div>
        </form>
    </div>

    <script nonce="{{ csp_nonce }}">
        (function createSakura() {
            const container = document.getElementById('sakuraContainer');
            if (!container || container.childElementCount) return;
            for (let i = 0; i < 24; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const size = Math.random() * 10 + 8;
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                petal.style.animationDelay = `${Math.random() * 8}s`;
                petal.style.animationDuration = `${Math.random() * 6 + 7}s`;
                container.appendChild(petal);
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await resp.json();
                if (data.success) {
                    if (data.must_change_password) alert('首次登录需先修改密码');
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误';
            }
        });
    </script>
</body>
</html>
