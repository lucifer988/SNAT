<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - SNAT 管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --text: #0f172a; --muted: #64748b; --border: #d4d9e3;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; 
            background:
                radial-gradient(1000px 560px at 15% -10%, rgba(79,70,229,.28), transparent 60%),
                radial-gradient(820px 480px at 110% 12%, rgba(5,150,105,.18), transparent 55%),
                #0f172a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        .login-box {
            background: #ffffff;
            padding: 38px 34px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(2,6,23,.45);
            width: 100%;
            max-width: 400px;
            margin: 0 20px;
        }
        @media (max-width: 768px) {
            .login-box { padding: 28px 20px; margin: 0 12px; }
            h1 { font-size: 22px; margin-bottom: 18px; }
            .form-group input { font-size: 16px; }
            button { font-size: 16px; }
        }
        h1 { text-align: center; margin-bottom: 26px; color: var(--text); font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px; }
        .form-group input { 
            width: 100%; 
            padding: 11px 13px; 
            border: 1px solid var(--border); 
            border-radius: 10px;
            font-size: 14px;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.18); }
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease;
            margin-top: 4px;
        }
        button:hover { background: var(--primary-hover); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,.4); }
        .error { color: #e11d48; margin-top: 12px; text-align: center; font-size: 14px; }
        .warning { 
            background: #fffbeb; 
            border: 1px solid #fde68a; 
            border-left: 3px solid #d97706;
            padding: 12px 14px; 
            border-radius: 10px; 
            margin-bottom: 22px;
            font-size: 13px;
            line-height: 1.6;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 SNAT 管理系统</h1>
        <div class="warning">
            ⚠️ 默认账号：admin / 安装时设置或自动生成<br>
            首次登录后必须修改密码，生产环境请通过 HTTPS 访问。
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">登录</button>
            <div class="error" id="error"></div>
        </form>
    </div>

    <script nonce="{{ csp_nonce }}">
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await resp.json();
                if (data.success) {
                    if (data.must_change_password) alert('首次登录需先修改密码');
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误';
            }
        });
    </script>
</body>
</html>
