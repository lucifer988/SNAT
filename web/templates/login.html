<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - SNAT 管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-pink: #ffb3c6;
            --primary-pink-strong: #ff85a1;
            --secondary-blue: #a8dadc;
            --secondary-blue-strong: #457b9d;
            --text: #4a4a4a;
            --muted: #7a6d74;
            --border: rgba(255, 179, 198, 0.36);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --danger: #ef476f;
            --warn-bg: rgba(255, 251, 235, 0.92);
            --warn-border: rgba(245, 158, 11, 0.32);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; 
            background: radial-gradient(circle at center, #1e1e38 0%, #080710 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .sakura-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            top: -20px;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.6), transparent);
            border-radius: 999px;
            opacity: 0.3;
            animation: sakura-fall linear infinite;
        }
        @keyframes sakura-fall {
            0% { transform: translateY(-50px); }
            100% { transform: translateY(110vh); }
        }
        .login-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 40px 34px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
            z-index: 2;
        }
        @media (max-width: 768px) {
            .login-box { padding: 28px 20px; margin: 0 12px; }
            h1 { font-size: 22px; margin-bottom: 18px; }
            .form-group input { font-size: 16px; }
            button { font-size: 16px; }
        }
        h1 { text-align: center; margin-bottom: 26px; color: #38bdf8; font-size: 24px; font-weight: 800; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #94a3b8; font-size: 14px; }
        .form-group input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }
        .form-group input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white; 
            border: none; 
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
            margin-top: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        button:hover { background: linear-gradient(135deg, #0ea5e9 0%, #4f46e5 100%); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, .35); }
        .error { color: var(--danger); margin-top: 12px; text-align: center; font-size: 14px; min-height: 20px; }
        .warning { 
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.08);
            border-left: 3px solid #38bdf8;
            padding: 12px 14px; 
            border-radius: 12px; 
            margin-bottom: 22px;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="sakura-container" id="sakuraContainer"></div>
    <div class="login-box">
        <h1>🔐 SNAT 管理系统</h1>
        <div class="warning">
            ⚠️ 默认账号：admin / 安装时设置或自动生成<br>
            首次登录后必须修改密码，生产环境请通过 HTTPS 访问。
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">登录</button>
            <div class="error" id="error"></div>
        </form>
    </div>

    <script nonce="{{ csp_nonce }}">
        (function createSakura() {
            const container = document.getElementById('sakuraContainer');
            if (!container || container.childElementCount) return;
            for (let i = 0; i < 24; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const size = Math.random() * 10 + 8;
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                petal.style.animationDelay = `${Math.random() * 8}s`;
                petal.style.animationDuration = `${Math.random() * 6 + 7}s`;
                container.appendChild(petal);
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await resp.json();
                if (data.success) {
                    if (data.must_change_password) alert('首次登录需先修改密码');
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误';
            }
        });
    </script>
</body>
</html>
